# Compile AIR Navig (moteur GeckoView de Mozilla) et publie l'APK signé dans « Releases ».
# Branche main : version publiée. Branche gecko : version d'essai (pré-version).
# Secret requis : KEYSTORE_PASSWORD (la clé chiffrée est dans base/signing-key.jks.enc).
name: Compiler l'APK

on:
  push:
    branches: [main, gecko]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Version
        run: |
          echo "VCODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VNAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Dernière version de GeckoView
        run: |
          META=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml
          VER=$(curl -fsSL "$META" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          test -n "$VER"
          echo "GECKO=org.mozilla.geckoview:geckoview-arm64-v8a:$VER" >> "$GITHUB_ENV"
          echo "GECKO_VER=$VER" >> "$GITHUB_ENV"
          echo "GeckoView $VER" 

      - name: Plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null || true

      - name: Code source embarqué
        run: |
          rm -rf build/src && mkdir -p build/src/AIR-Navig-source
          cp -r java res AndroidManifest.xml build.gradle settings.gradle build/src/AIR-Navig-source/
          mkdir -p build/src/AIR-Navig-source/assets && cp -r assets/air build/src/AIR-Navig-source/assets/
          cp README.md build/src/AIR-Navig-source/LISEZMOI.md
          rm -f assets/AIR-Navig-source.zip
          (cd build/src && zip -qr -X "$GITHUB_WORKSPACE/assets/AIR-Navig-source.zip" AIR-Navig-source)

      - name: Clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret KEYSTORE_PASSWORD manquant"; exit 1; fi
          mkdir -p build
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in base/signing-key.jks.enc -out build/key.jks -pass env:KEYSTORE_PASSWORD
          echo "KS_FILE=$GITHUB_WORKSPACE/build/key.jks" >> "$GITHUB_ENV"

      - name: Compiler
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease -Pgecko="$GECKO" -Pvcode="$VCODE" -Pvname="$VNAME"

      - name: Vérifier l'APK
        run: |
          APK=$(ls build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          mkdir -p out && cp "$APK" "out/AIR-Navig-${VNAME}.apk"
          rm -f build/key.jks
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AIR-Navig-${{ env.VNAME }}
          path: out/

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release create "v${VNAME}" "out/AIR-Navig-${VNAME}.apk" --latest \
              --title "AIR Navig 1.0 (build ${GITHUB_RUN_NUMBER})" \
              --notes "Moteur GeckoView ${GECKO_VER} (Mozilla), sans WebView. APK compilé depuis le commit ${GITHUB_SHA::7}."
          else
            gh release create "v${VNAME}-gecko" "out/AIR-Navig-${VNAME}.apk" --prerelease --latest=false \
              --title "AIR Navig 1.0 (build ${GITHUB_RUN_NUMBER}) — essai GeckoView" \
              --notes "Version d'essai sans WebView, moteur GeckoView ${GECKO_VER} (Mozilla), branche gecko, commit ${GITHUB_SHA::7}."
          fi
