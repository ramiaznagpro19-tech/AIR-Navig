# Compile AIR Navig et publie l'APK signé dans « Releases » à chaque envoi sur main.
# Secrets à créer (Settings › Secrets and variables › Actions) :
#   KEYSTORE_B64      : la clé de signature (.jks) encodée en base64
#   KEYSTORE_PASSWORD : son mot de passe (alias « air »)
name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Outils Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "AJAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Version
        run: |
          echo "VCODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VNAME=3.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compiler le code Java
        run: |
          mkdir -p build/classes build/dex
          javac --release 8 -encoding UTF-8 -nowarn -cp "$AJAR" -d build/classes java/*.java
          "$BT/d8" --release --min-api 24 --lib "$AJAR" --output build/dex $(find build/classes -name '*.class')

      - name: Assembler l'APK
        run: |
          java -jar apktool.jar d -s -f base/AIR-Navig-base.apk -o build/dec
          cp build/dex/classes.dex build/dec/classes.dex
          cp assets/* build/dec/assets/
          cp res/xml/network_security_config.xml build/dec/res/xml/network_security_config.xml
          # Code source embarqué dans l'appli
          mkdir -p build/src/AIR-Navig-source
          cp -r java assets res AndroidManifest.xml build/src/AIR-Navig-source/
          rm -f build/src/AIR-Navig-source/assets/blocklist.txt
          cp README.md build/src/AIR-Navig-source/LISEZMOI.md
          rm -f build/dec/assets/AIR-Navig-source.zip
          (cd build/src && zip -qr -X ../dec/assets/AIR-Navig-source.zip AIR-Navig-source)
          sed -i -E "s/^  versionCode: .*/  versionCode: ${VCODE}/; s/^  versionName: .*/  versionName: '${VNAME}'/" build/dec/apktool.yml
          java -jar apktool.jar b build/dec -o build/unsigned.apk
          "$BT/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk

      - name: Signer
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 manquant"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > build/key.jks
          "$BT/apksigner" sign --ks build/key.jks --ks-key-alias air --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "build/AIR-Navig-${VNAME}.apk" build/aligned.apk
          "$BT/apksigner" verify --print-certs "build/AIR-Navig-${VNAME}.apk"
          rm -f build/key.jks

      - uses: actions/upload-artifact@v4
        with:
          name: AIR-Navig-${{ env.VNAME }}
          path: build/AIR-Navig-${{ env.VNAME }}.apk

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VNAME}" "build/AIR-Navig-${VNAME}.apk" \
            --title "AIR Navig ${VNAME}" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}."
