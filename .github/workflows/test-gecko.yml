# Essai réel d'AIR Navig (GeckoView) sur un émulateur Android : captures d'écran + journal.
name: Tester sur émulateur

on:
  push:
    branches: [gecko]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Version de GeckoView (x86_64 pour l'émulateur)
        run: |
          META=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-x86_64/maven-metadata.xml
          VER=$(curl -fsSL "$META" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "GECKO=org.mozilla.geckoview:geckoview-x86_64:$VER" >> "$GITHUB_ENV"

      - name: Plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null || true

      - name: Compiler la version de test
        run: gradle --no-daemon assembleDebug -Pgecko="$GECKO" -Pabi=x86_64 -Pvcode=1 -Pvname=test

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'appli sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-emulateur
          path: out/

      - name: Enregistrer les résultats sur la branche essais
        if: always()
        run: |
          cd out
          git init -q -b essais
          git config user.name "AIR Navig CI"
          git config user.email "ci@airnavig.invalid"
          git add -A
          git commit -qm "Essai émulateur ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" essais
