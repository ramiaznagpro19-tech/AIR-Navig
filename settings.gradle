// AIR Navig — application Android sur le moteur AIRCore (Gecko).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        // Moteur AIRCore, téléchargé depuis les « Releases » du dépôt AIRCore (aircore-maven.zip).
        maven { url = uri("aircore-maven") }
        google()
        mavenCentral()
        maven { url = uri("https://maven.mozilla.org/maven2/") }
    }
}

rootProject.name = "AIRNavig"
